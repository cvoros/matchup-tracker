name: Update Matchup Stats

on:
  schedule:
    # Hourly at :37 past (UTC), March–November only. This is a
    # FAILSAFE against firing all winter if it's ever left enabled by
    # mistake — it is NOT the season on/off switch. The real switch is
    # disabling/re-enabling this workflow itself (Actions tab → Update
    # Matchup Stats → "..." → Disable/Enable workflow); see README.
    #
    # :37 is deliberate — do NOT "tidy" this back to :00. GitHub's
    # scheduler is best-effort and queues `schedule` events on shared
    # infrastructure, and load is heaviest at the top of every hour
    # because that's where every naive cron on the platform sits. While
    # this was on '0 * * 3-11 *', exactly 1 of ~55 runs actually started
    # at :00 — the rest were delayed 1–59 minutes, and any run pushed
    # past the next hour's event collided with it and was dropped. Net
    # effect was ~6 runs/day instead of 24. An off-peak minute avoids
    # that herd. It still buys no guarantee; only an external
    # workflow_dispatch trigger would.
    - cron: '37 * * 3-11 *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch stats
        run: python fetch_stats.py

      - name: Fetch league data
        # Belt-and-suspenders on top of fetch_league.py's own graceful
        # exit(0): even an unexpected crash here must not block the
        # stats.json commit below.
        continue-on-error: true
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python fetch_league.py

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats.json data/league.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update matchup stats - $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
